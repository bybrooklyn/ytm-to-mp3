version: 2
project_name: ytm

before:
  hooks:
    - go mod verify

builds:
  - id: ytm
    main: ./cmd/ytm
    binary: ytm
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: ytm
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "ytm_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md, LICENSE]

checksum:
  name_template: checksums.txt

signs:
  - id: cosign-checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - --yes
      - --output-signature=${signature}
      - --output-certificate=${certificate}
      - ${artifact}

nfpms:
  - id: packages
    package_name: ytm
    vendor: ytm-to-mp3
    homepage: https://github.com/bybrooklyn/mfetchy
    maintainer: bybrooklyn
    description: Download your YouTube Music library as tagged audio files
    license: MIT
    formats: [deb, rpm]
    recommends: [ffmpeg]

# A cask (goreleaser deprecated binary formulas). ffmpeg isn't a dependency: ytm fetches
# its own copy when none is installed.
homebrew_casks:
  - name: ytm
    repository:
      owner: bybrooklyn
      name: homebrew-tap
      token: '{{ with index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}{{ . }}{{ end }}'
    homepage: https://github.com/bybrooklyn/mfetchy
    description: Download your YouTube Music library as tagged audio files
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}auto{{ else }}true{{ end }}'
    hooks:
      post:
        # the binary isn't notarized: without this macOS refuses to run it
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/ytm"]
          end

scoops:
  - name: ytm
    repository:
      owner: bybrooklyn
      name: scoop-bucket
      token: '{{ with index .Env "SCOOP_BUCKET_GITHUB_TOKEN" }}{{ . }}{{ end }}'
    homepage: https://github.com/bybrooklyn/mfetchy
    description: Download your YouTube Music library as tagged audio files
    license: MIT
    skip_upload: '{{ if index .Env "SCOOP_BUCKET_GITHUB_TOKEN" }}auto{{ else }}true{{ end }}'

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:", "Merge pull request"]

release:
  github:
    owner: bybrooklyn
    name: ytm-to-mp3
